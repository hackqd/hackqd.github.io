<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="hackqd.png">
    <title>hackqd</title>
</head>

<body>

    <!-- Background Blob Images -->
    <div class="blob-container">
        <img src="blob-haikei.png" alt="Background Blob" class="blob blob-1">
        <img src="blob-haikei.png" alt="Background Blob" class="blob blob-2">
    </div>
    
    <h1 class="hero-heading">Hello! I'm <span class="typewriter" id="typewriter-text"></span></h1>

    <div class="glassmorphism-card">
        <div class="glassmorphism-card-content">
            <p>A 14yr old designer, programmer who does pretty much anything on the internet, specifically what i like to learn.. feel free to add me on discord!</p>
        </div>
        
        <div class="social-container">
            <!-- Discord Icon -->
            <a href="https://discord.com/users/984067247209340958" target="_blank" class="social-icon discord-icon">
                <i class="fa-brands fa-discord"></i>
            </a>
        
            <!-- GitHub Icon -->
            <a href="https://github.com/hackqd" target="_blank" class="social-icon github-icon">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>
    </div>

    <div class="language-usage">
        <h2>Code Breakdown (Website)</h2>
        <div class="language-bar">
            <div class="lang css" style="width: 67.4%;"></div>
            <div class="lang html" style="width: 28.4%;"></div>
            <div class="lang javascript" style="width: 4.2%;"></div>

        </div>
        <div class="language-labels">
            <span><span class="dot css"></span>CSS (67.4%)</span>
            <span><span class="dot html"></span>HTML (28.4%)</span>
            <span><span class="dot javascript"></span>JS (4.2%)</span>
        </div>
    </div>
    
    
    

    <!-- Making the Navbar -->
    <header class="header">
        
        <a href="index.html" class="logo">
            <img src="hackqd.png" alt="hackqd-logo" class="logo-img" height="50px" width="75px"> 
            <span>hackqd</span>
        </a>


          <!-- Hidden Checkbox for toggling the menu -->
    <input type="checkbox" id="check" hidden> <!-- The 'hidden' attribute hides the checkbox -->

    <!-- Label for the toggle button -->
    <label for="check" class="icons">
        <i class="fa-solid fa-bars bx-md" id="menu-icon"></i> <!-- Hamburger icon -->
        <i class='bx bx-x' id="close-icon"></i> <!-- Close icon -->
    </label>

        <!-- navbar links-->
        <nav class="navbar">
            <a href="#">
                Home
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </a>
            <a href="design.html">
                Designs
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </a>
            <a href="shop.html">
                Shop
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </a>
        </nav>


    </header>

    <script>
        const words = ["Hackqd", "Aaditya"];
        let i = 0;
        let j = 0;
        let currentWord = '';
        let isDeleting = false;
        const speed = 100;
        const element = document.getElementById('typewriter-text');
    
        function type() {
            currentWord = words[i];
            
            if (isDeleting) {
                element.textContent = currentWord.substring(0, j--);
            } else {
                element.textContent = currentWord.substring(0, j++);
            }
    
            if (!isDeleting && j > currentWord.length) {
                isDeleting = true;
                setTimeout(type, 1200); // pause after typing
                return;
            }
    
            if (isDeleting && j < 0) {
                isDeleting = false;
                i = (i + 1) % words.length;
            }
    
            setTimeout(type, isDeleting ? speed / 2 : speed);
        }
    
        document.addEventListener("DOMContentLoaded", () => {
            type();
        });
    </script>
    
    <script>
        fetch('language-data.json')
            .then(response => response.json())
            .then(data => {
                const htmlPercent = data.HTML || 0;
                const cssPercent = data.CSS || 0;
                const jsPercent = data.JS || 0;
    
                document.querySelector('.lang.html').style.width = htmlPercent + '%';
                document.querySelector('.lang.css').style.width = cssPercent + '%';
                document.querySelector('.lang.javascript').style.width = jsPercent + '%';
    
                document.querySelector('.lang.html').textContent = `HTML (${htmlPercent}%)`;
                document.querySelector('.lang.css').textContent = `CSS (${cssPercent}%)`;
                document.querySelector('.lang.javascript').textContent = `JS (${jsPercent}%)`;

            })
            .catch(err => {
                console.error('Could not load language data:', err);
            });
    </script>
    
        
    
    
    
</body>

</html>
